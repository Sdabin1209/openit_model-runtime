[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-runtime"
version = "0.6.3"
description = "문진 시스템 model-runtime: LoRA 모델 호출, 프롬프트, 출력 검증"
requires-python = ">=3.10"
# boundary-contracts는 Git 태그로 설치한다(공통 규칙): pip install git+ssh://git@github.com/Sdabin1209/openit_boundary-contracts.git@v2.0.0
dependencies = ["jsonschema>=4.10", "boundary-contracts"]

[project.optional-dependencies]
dev = ["pytest", "turn-engine @ git+ssh://git@github.com/Sdabin1209/openit_turn-engine.git@v0.3.0"]   # 시험 전용: validate_extraction을 직접 호출한다
vllm = ["vllm"]   # 첫 백엔드 의존(지연 import). 정확한 버전은 GPU 시험 뒤에 고정한다(scripts/gpu_check.sh가 설치 버전을 기록).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
