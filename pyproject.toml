[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-runtime"
version = "0.11.9"
description = "문진 시스템 model-runtime: LoRA 모델 호출, 프롬프트, 출력 검증"
requires-python = ">=3.10"
# boundary-contracts는 Git 태그로 설치한다(공통 규칙): pip install git+ssh://git@github.com/Sdabin1209/openit_boundary-contracts.git@<태그>  (태그의 정본은 Dockerfile의 ARG BOUNDARY_VERSION, 설치는 scripts/setup-env.sh)
dependencies = ["jsonschema>=4.18", "waitress>=3.0", "boundary-contracts"]   # waitress: 추론 서버의 WSGI 서버(ADR 0022)

[project.optional-dependencies]
dev = ["pytest"]   # 출력 규칙 시험은 계약의 check_action_extraction과 문진 스키마의 흐름표를 쓴다
vllm = ["vllm"]   # 첫 백엔드 의존(지연 import). 정확한 버전은 GPU 시험 뒤에 고정한다(scripts/gpu_check.sh가 설치 버전을 기록).

# 패키지 목록은 손으로 쓰지 않는다: setup.py가 find_packages("src")로 찾고, 리포 루트 schemas/만 model_runtime.schemas로 더한다
# (pyproject의 [tool.setuptools.packages.find]를 쓰면 src 밖의 schemas/를 설치물에 넣을 수 없어 setup.py에 둔다. tests/test_wheel_public_names.py가 wheel을 실제로 설치해 확인한다)
[tool.setuptools.package-data]
model_runtime = ["data/*.json"]
"model_runtime.schemas" = ["*.json"]
"model_runtime.schemas.examples" = ["*.json"]   # 모방 컴포넌트의 규칙표(비편집 설치에서도 따라가게)

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
